# kind cluster that publishes Grafana's NodePort on the laptop.
# Guestbook itself stays ClusterIP; use kubectl port-forward for the UI.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 30300
        protocol: TCP
